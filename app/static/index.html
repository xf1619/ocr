<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek-OCR 前端演示</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        background: #f5f7fb;
      }
      .container {
        max-width: 900px;
        margin: 24px auto;
        padding: 24px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      h1 { margin-top: 0; }
      .row { margin-bottom: 16px; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      textarea, input[type="text"], input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #d7dbe5;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      pre {
        background: #111827;
        color: #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        white-space: pre-wrap;
      }
      .hint { color: #6b7280; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DeepSeek-OCR（硅基流动）</h1>
      <p class="hint">上传图片后，调用 <code>/api/v1/ocr/file</code> 返回识别文本。</p>

      <div class="row">
        <label for="prompt">OCR 提示词</label>
        <input id="prompt" type="text" value="请提取图片中的全部文字，按原有段落输出。" />
      </div>

      <div class="row">
        <label for="file">图片文件</label>
        <input id="file" type="file" accept="image/*" />
      </div>

      <div class="row">
        <button id="submitBtn">开始识别</button>
      </div>

      <div class="row">
        <label>识别结果</label>
        <pre id="result">等待识别...</pre>
      </div>
    </div>

    <script>
      const btn = document.getElementById('submitBtn');
      const fileInput = document.getElementById('file');
      const promptInput = document.getElementById('prompt');
      const result = document.getElementById('result');

      btn.addEventListener('click', async () => {
        const file = fileInput.files?.[0];
        if (!file) {
          alert('请先选择图片文件');
          return;
        }

        btn.disabled = true;
        result.textContent = '识别中...';

        try {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('prompt', promptInput.value || '请提取图片中的全部文字。');

          const resp = await fetch('/api/v1/ocr/file', {
            method: 'POST',
            body: formData,
          });

          const data = await resp.json();
          if (!resp.ok) {
            result.textContent = `请求失败: ${JSON.stringify(data, null, 2)}`;
            return;
          }

          result.textContent = data.text || '(未识别到文本)';
        } catch (err) {
          result.textContent = `调用失败: ${err}`;
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
